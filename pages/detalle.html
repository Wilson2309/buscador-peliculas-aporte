<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlick | Detalle</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = { theme: { extend: { colors: { cineBlack: "#0b0b0b", cineDark: "#141414", cineRed: "#e50914", cineGray: "#b3b3b3" }, boxShadow: { glow: "0 0 25px rgba(229, 9, 20, 0.35)" }, keyframes: { pulseSoft: { "0%, 100%": { opacity: "0.4" }, "50%": { opacity: "1" } }, spinSlow: { "0%": { transform: "rotate(0deg)" }, "100%": { transform: "rotate(360deg)" } } }, animation: { pulseSoft: "pulseSoft 2s ease-in-out infinite", spinSlow: "spinSlow 1s linear infinite" } } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-cineBlack text-white antialiased selection:bg-cineRed selection:text-white" data-page="detail">
    <main class="relative pt-28">
      <section class="mx-auto max-w-6xl px-4 pb-16 pt-8 sm:px-6 lg:px-8">
        <div id="detailRoot" class="overflow-hidden rounded-2xl border border-white/10 bg-cineDark shadow-2xl"></div>
      </section>
    </main>
    <script type="module" src="/js/pages/detail.js"></script>
  </body>
</html>
