<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlick | Peliculas</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = { theme: { extend: { colors: { cineBlack: "#0b0b0b", cineDark: "#141414", cineRed: "#e50914", cineGray: "#b3b3b3" }, boxShadow: { glow: "0 0 25px rgba(229, 9, 20, 0.35)" }, keyframes: { pulseSoft: { "0%, 100%": { opacity: "0.4" }, "50%": { opacity: "1" } }, spinSlow: { "0%": { transform: "rotate(0deg)" }, "100%": { transform: "rotate(360deg)" } } }, animation: { pulseSoft: "pulseSoft 2s ease-in-out infinite", spinSlow: "spinSlow 1s linear infinite" } } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-cineBlack text-white antialiased selection:bg-cineRed selection:text-white" data-page="peliculas">
    <main class="relative pt-28">
      <section class="mx-auto max-w-7xl px-4 pb-10 pt-10 sm:px-6 lg:px-8">
        <p id="pageKicker" class="text-xs uppercase tracking-[0.2em] text-cineGray">Explora CineFlick</p>
        <h1 id="pageTitle" class="mt-2 text-4xl font-black md:text-6xl">Catalogo de peliculas</h1>
      </section>

      <section id="categorias" class="mx-auto max-w-7xl px-4 pb-10 sm:px-6 lg:px-8">
        <h2 class="mb-5 text-2xl font-bold md:text-3xl">Categorias</h2>
        <div id="genres-container" class="flex flex-wrap gap-3"></div>
      </section>

      <section id="peliculas" class="mx-auto max-w-7xl px-4 pb-10 sm:px-6 lg:px-8">
        <div class="rounded-2xl border border-white/10 bg-cineDark/90 p-5 shadow-lg backdrop-blur-md sm:p-6">
          <div class="mb-5 flex items-center justify-between gap-4">
            <h2 class="text-2xl font-bold md:text-3xl">Busqueda y filtros avanzados</h2>
            <button id="clearFiltersButton" type="button" class="rounded-full border border-white/20 px-4 py-2 text-xs uppercase tracking-[0.14em] text-cineGray transition hover:border-cineRed hover:text-white">Limpiar</button>
          </div>
          <form id="filtersForm" class="filters-panel grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-5">
            <div class="md:col-span-2 lg:col-span-1">
              <label for="filterSearchInput" class="mb-2 block text-xs uppercase tracking-[0.15em] text-cineGray">Busqueda</label>
              <input id="filterSearchInput" type="text" placeholder="Ej: Batman" class="filter-control w-full rounded-lg border border-white/15 bg-cineBlack px-4 py-3 text-sm outline-none transition focus:border-cineRed focus:ring-2 focus:ring-cineRed/25" />
            </div>
            <div>
              <label for="genreFilter" class="mb-2 block text-xs uppercase tracking-[0.15em] text-cineGray">Genero</label>
              <select id="genreFilter" class="filter-control w-full rounded-lg border border-white/15 bg-cineBlack px-4 py-3 text-sm outline-none transition focus:border-cineRed focus:ring-2 focus:ring-cineRed/25"><option value="">Todos</option></select>
            </div>
            <div>
              <label for="yearFilter" class="mb-2 block text-xs uppercase tracking-[0.15em] text-cineGray">Ano</label>
              <input id="yearFilter" type="text" list="yearOptions" maxlength="4" placeholder="Escribe o elige" inputmode="numeric" autocomplete="off" class="filter-control year-input w-full rounded-lg border border-white/15 bg-cineBlack px-4 py-3 text-sm outline-none transition focus:border-cineRed focus:ring-2 focus:ring-cineRed/25" />
              <datalist id="yearOptions"></datalist>
            </div>
            <div>
              <label for="sortByFilter" class="mb-2 block text-xs uppercase tracking-[0.15em] text-cineGray">Popularidad</label>
              <select id="sortByFilter" class="filter-control w-full rounded-lg border border-white/15 bg-cineBlack px-4 py-3 text-sm outline-none transition focus:border-cineRed focus:ring-2 focus:ring-cineRed/25">
                <option value="popularity.desc">Mas populares</option>
                <option value="popularity.asc">Menos populares</option>
                <option value="release_date.desc">Mas recientes</option>
                <option value="release_date.asc">Mas antiguas</option>
              </select>
            </div>
            <div>
              <label for="ratingFilter" class="mb-2 block text-xs uppercase tracking-[0.15em] text-cineGray">Rating minimo</label>
              <select id="ratingFilter" class="filter-control w-full rounded-lg border border-white/15 bg-cineBlack px-4 py-3 text-sm outline-none transition focus:border-cineRed focus:ring-2 focus:ring-cineRed/25">
                <option value="">Cualquiera</option><option value="9">9+</option><option value="8">8+</option><option value="7">7+</option><option value="6">6+</option><option value="5">5+</option>
              </select>
            </div>
          </form>
          <div id="filtersActionRow" class="mt-5 hidden items-center justify-between gap-3 border-t border-white/10 pt-5 sm:flex-row">
            <p id="filtersHint" class="text-sm text-cineGray">Listo para buscar peliculas con tus filtros.</p>
            <button id="advancedSearchButton" type="button" class="rounded-full bg-cineRed px-6 py-3 text-sm font-bold transition hover:bg-red-600 hover:shadow-glow">Buscar</button>
          </div>
        </div>
      </section>

      <section class="mx-auto max-w-7xl px-4 pb-16 sm:px-6 lg:px-8">
        <div class="section-heading mb-6 flex items-center justify-between gap-4">
          <h2 class="text-2xl font-bold md:text-3xl">Resultados</h2>
          <p id="resultsCount" class="text-sm text-cineGray">0 resultados</p>
        </div>
        <div class="relative">
          <div class="carousel-fade left"></div>
          <div class="carousel-fade right"></div>
          <button type="button" data-carousel-prev="movies-grid" class="carousel-arrow absolute left-2 top-1/2 z-20 hidden -translate-y-1/2 md:inline-flex">&lsaquo;</button>
          <button type="button" data-carousel-next="movies-grid" class="carousel-arrow absolute right-2 top-1/2 z-20 hidden -translate-y-1/2 md:inline-flex">&rsaquo;</button>
          <div id="movies-grid" class="no-scrollbar flex snap-x snap-mandatory gap-4 overflow-x-auto scroll-smooth pb-3" aria-live="polite"></div>
        </div>
      </section>
    </main>
    <script type="module" src="./js/pages/movies.js"></script>
  </body>
</html>
